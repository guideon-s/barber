<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Barbero — Nuevo Cliente</title>
  <link rel="icon" href="https://media.istockphoto.com/id/2163724259/es/vector/ilustraci%C3%B3n-vintage-del-logotipo-del-poste-de-la-peluquer%C3%ADa.jpg?s=612x612&w=0&k=20&c=P93WbPTS9UyM9l3THb6H_Eb0F_K4TcYgMHKBf7_vZ1s=" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #121216;
      --surface-2: #18181f;
      --border: rgba(245, 197, 24, 0.22);
      --border-bright: rgba(245, 197, 24, 0.68);
      --gold: #f5c518;
      --gold-soft: rgba(245, 197, 24, 0.12);
      --gold-hover: #ffd43b;
      --text: #f4f4f6;
      --muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(245, 197, 24, 0.15) 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    .logo-header {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-bright);
      background: #fff;
      flex-shrink: 0;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 9, 11, 0.92);
      backdrop-filter: blur(10px);
    }

    .nav-inner {
      max-width: 460px;
      margin: 0 auto;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: "Cinzel", serif;
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
      font-size: 0.86rem;
    }

    .nav-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.74rem;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .nav-links a:hover,
    .nav-links a:active {
      transform: translateY(-1px);
      border-color: var(--border-bright);
      color: var(--gold);
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
      padding: 12px 10px 36px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      margin-bottom: 10px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.42);
    }

    .pill {
      display: inline-block;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 5px;
    }

    h1, h2 {
      font-family: "Cinzel", serif;
      color: var(--gold);
      margin: 0 0 3px;
    }

    h1 { font-size: 1.06rem; }
    h2 { font-size: 0.9rem; }

    .sub {
      color: var(--muted);
      font-size: 0.76rem;
      margin: 0 0 9px;
      line-height: 1.32;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .field {
      margin-bottom: 8px;
    }

    label {
      display: block;
      font-size: 0.74rem;
      margin-bottom: 4px;
      color: #e4e4e7;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245, 197, 24, 0.15);
    }

    button {
      width: 100%;
      margin-top: 4px;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      background: var(--gold);
      color: #111;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.2s ease;
    }

    button:hover,
    button:active {
      background: var(--gold-hover);
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(245, 197, 24, 0.25);
    }

    .aviso-horario {
      display: none;
      margin-top: 7px;
      padding: 7px 9px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fecaca;
      font-size: 0.75rem;
    }

    .msg {
      margin-top: 7px;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.32;
    }

    .msg.ok { color: #86efac; }
    .msg.err { color: #fca5a5; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="./principal.html">
        <img class="logo-header" src="https://media.istockphoto.com/id/2163724259/es/vector/ilustraci%C3%B3n-vintage-del-logotipo-del-poste-de-la-peluquer%C3%ADa.jpg?s=612x612&w=0&k=20&c=P93WbPTS9UyM9l3THb6H_Eb0F_K4TcYgMHKBf7_vZ1s=" alt="Logo" />
        <span>EL BARBERO</span>
      </a>
      <nav class="nav-links">
        <a href="./principal.html">← Inicio</a>
        <a href="../agendar-codigo.html">Con código</a>
        <a href="./contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <form id="form-registro-movil" class="card">
      <span class="pill">17:00–22:00 • $99 MXN</span>
      <h1>NUEVO CLIENTE</h1>
      <p class="sub">Regístrate, agenda tu cita y recibe tu código de sellos.</p>

      <div class="grid-2">
        <div class="field">
          <label for="mov-nombre">Nombre</label>
          <input id="mov-nombre" type="text" placeholder="Ej. Juan" required />
        </div>
        <div class="field">
          <label for="mov-apellido">Apellido</label>
          <input id="mov-apellido" type="text" placeholder="Ej. Martínez" />
        </div>
      </div>

      <div class="field">
        <label for="mov-telefono">Teléfono</label>
        <input id="mov-telefono" type="tel" placeholder="Ej. 6641234567" required />
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="mov-fecha">Fecha</label>
          <input id="mov-fecha" type="date" required />
        </div>
        <div class="field">
          <label for="mov-hora">Hora (17–22h)</label>
          <input id="mov-hora" type="time" required />
        </div>
      </div>

      <div id="mov-aviso-horario" class="aviso-horario"></div>

      <button type="submit">Confirmar cita ($99 MXN)</button>
      <div id="mov-msg" class="msg">Completa tus datos para agendar.</div>
    </form>

    <div class="card">
      <h2>CÓDIGO Y TICKET</h2>
      <div id="mov-ticket" class="msg" style="margin-top:4px;">
        Aún no hay cita registrada.
      </div>
    </div>
  </main>

  <script type="module">
    import {
      estaDentroDeHorario,
      obtenerCitasPorFecha,
      guardarCitaYCliente
    } from "../js/db.js";

    const form = document.getElementById("form-registro-movil");
    const nombreEl = document.getElementById("mov-nombre");
    const apellidoEl = document.getElementById("mov-apellido");
    const telefonoEl = document.getElementById("mov-telefono");
    const fechaEl = document.getElementById("mov-fecha");
    const horaEl = document.getElementById("mov-hora");
    const avisoHorario = document.getElementById("mov-aviso-horario");
    const msgEl = document.getElementById("mov-msg");
    const ticketEl = document.getElementById("mov-ticket");

    function generarCodigo(nombre, apellido) {
      const i1 = (nombre.trim()[0] || "c").toLowerCase();
      const i2 = (apellido.trim()[0] || nombre.trim()[1] || "l").toLowerCase();
      const prefijo = `${i1}${i2}`.replace(/[^a-z]/g, "") || "cl";
      const num = Math.floor(10000 + Math.random() * 90000);
      return `${prefijo}-${num}`;
    }

    function formatearFechaMX(fechaISO) {
      if (!fechaISO || !fechaISO.includes("-")) return fechaISO;
      const [y, m, d] = fechaISO.split("-");
      return `${d}/${m}/${y}`;
    }

    async function validarHorarioYEspera() {
      const hora = horaEl.value;
      const fecha = fechaEl.value;

      if (!hora) {
        avisoHorario.style.display = "none";
        return { ok: false, conEspera: false };
      }

      if (!estaDentroDeHorario(hora)) {
        avisoHorario.textContent =
          "No estamos abiertos a esa hora. Horario: 17:00 a 22:00.";
        avisoHorario.style.display = "block";
        return { ok: false, conEspera: false };
      }

      avisoHorario.style.display = "none";
      if (!fecha) return { ok: true, conEspera: false };

      const citasDia = await obtenerCitasPorFecha(fecha);
      const hayCitaReal = citasDia.some((c) => c.hora === hora);
      return { ok: true, conEspera: hayCitaReal };
    }

    horaEl.addEventListener("change", validarHorarioYEspera);
    fechaEl.addEventListener("change", validarHorarioYEspera);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nombre = nombreEl.value.trim();
      const apellido = apellidoEl.value.trim();
      const telefono = telefonoEl.value.trim();
      const fecha = fechaEl.value;
      const hora = horaEl.value;

      const check = await validarHorarioYEspera();
      if (!check.ok) {
        msgEl.className = "msg err";
        msgEl.textContent = "Elige una hora entre 17:00 y 22:00.";
        return;
      }

      if (!nombre || !telefono || !fecha || !hora) {
        msgEl.className = "msg err";
        msgEl.textContent = "Completa los campos requeridos.";
        return;
      }

      const codigo = generarCodigo(nombre, apellido);
      const fechaMX = formatearFechaMX(fecha);
      const citaObj = {
        id: `cita-${Date.now()}`,
        codigo,
        nombre,
        apellido,
        telefono,
        fecha,
        fechaMX,
        hora,
        precio: 99,
        moneda: "MXN",
        estado: "Pendiente",
        conEspera: check.conEspera,
        nota: check.conEspera ? "Con espera" : "Turno normal"
      };

      msgEl.className = "msg";
      msgEl.textContent = "Guardando cita...";

      try {
        await guardarCitaYCliente(citaObj);
        ticketEl.className = "msg ok";
        ticketEl.innerHTML = `
          <div><strong>Código:</strong> ${codigo}</div>
          <div><strong>Cliente:</strong> ${nombre} ${apellido}</div>
          <div><strong>Tel:</strong> ${telefono}</div>
          <div><strong>Fecha y hora:</strong> ${fechaMX} • ${hora}</div>
          <div><strong>Nota:</strong> ${citaObj.nota} • $99 MXN</div>
        `;
        msgEl.className = "msg ok";
        msgEl.textContent = `¡Listo! Tu código es ${codigo}.`;
      } catch (err) {
        msgEl.className = "msg err";
        msgEl.textContent = `Error: ${err.message || err}`;
      }
    });
  </script>
</body>
</html>
