<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto Móvil — El Barbero</title>
  <link rel="icon" href="https://media.istockphoto.com/id/2163724259/es/vector/ilustraci%C3%B3n-vintage-del-logotipo-del-poste-de-la-peluquer%C3%ADa.jpg?s=612x612&w=0&k=20&c=P93WbPTS9UyM9l3THb6H_Eb0F_K4TcYgMHKBf7_vZ1s=" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --panel: #121216;
      --row: #18181f;
      --line: rgba(245, 197, 24, 0.24);
      --line-hover: rgba(245, 197, 24, 0.75);
      --gold: #f5c518;
      --gold-bg: rgba(245, 197, 24, 0.12);
      --ink: #f4f4f6;
      --muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(245, 197, 24, 0.12) 0%, transparent 45%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      font-family: "Cinzel", serif;
      font-weight: 800;
      font-size: 0.86rem;
      color: var(--gold);
    }

    .brand-img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--line-hover);
      background: #fff;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .menu a {
      text-decoration: none;
      color: var(--ink);
      background: var(--row);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.74rem;
    }

    .menu a:hover,
    .menu a:active {
      color: var(--gold);
      border-color: var(--line-hover);
    }

    .menu a.destacado {
      background: var(--gold);
      color: #111111;
      border-color: var(--gold);
      font-weight: 700;
    }

    .page-wrap {
      max-width: 460px;
      margin: 0 auto;
      padding: 14px 10px 42px;
    }

    .box-contacto {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 14px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }

    .pill {
      display: inline-block;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0 0 4px;
      font-family: "Cinzel", serif;
      font-size: 1.24rem;
      color: var(--gold);
    }

    .subtitulo {
      margin: 0 0 12px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.35;
    }

    .canales-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .canal-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-decoration: none;
      background: var(--row);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 11px;
      color: var(--ink);
    }

    .canal-card:active {
      border-color: var(--line-hover);
      background: #1f1f28;
    }

    .canal-izq {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icono-red {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icono-ig {
      background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af);
      color: #ffffff;
    }

    .icono-wa {
      background: rgba(37, 211, 102, 0.16);
      border: 1px solid rgba(37, 211, 102, 0.45);
      color: #25d366;
    }

    .canal-titulo {
      font-weight: 700;
      font-size: 0.82rem;
      color: #ffffff;
    }

    .canal-dato {
      font-size: 0.74rem;
      color: var(--gold);
      margin-top: 1px;
    }

    .flecha-ir {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--gold);
      white-space: nowrap;
    }
